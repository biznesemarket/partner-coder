name: partner-coder-local

services:
  postgres:
    image: postgres:17-alpine
    container_name: partner-coder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: partner
      POSTGRES_PASSWORD: partner
      POSTGRES_DB: partner_coder
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partner -d partner_coder"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: partner-coder-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  minio:
    image: minio/minio:latest
    container_name: partner-coder-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: partner
      MINIO_ROOT_PASSWORD: partner-secret
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 partner partner-secret &&
      mc mb --ignore-existing local/partner-coder &&
      mc anonymous set none local/partner-coder &&
      echo 'bucket partner-coder готов'
      "

volumes:
  postgres-data:
  minio-data:
